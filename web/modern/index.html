  const markerColor = entity.type.includes('robot') ? 0x7dd3fc : 0x38bdf8;
  const marker = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.7, 0.7, 18), translucent(markerColor, 0.65));
  marker.rotation.x = Math.PI / 2;
  marker.position.z = 0.5;
  group.add(marker);
  const label = labelSprite(entity.name || entity.id, '#bfe9ff');
  label.position.set(0, -3.7, 5.8);
  group.add(label);
  loadEquipmentIcon(entityIconType(entity.type), null, true).then(canvas => {
    if (!entityObjects.has(entity.id)) return;
    const sprite = createEquipmentSprite(0, 0, 5, 5, canvas);
    sprite.userData.mobileEntity = entity.id;
    group.add(sprite);
    render();
  });
  return group;
}

function applyEntities(entities) {
  mobileEntities = Array.isArray(entities) ? entities : [];
  ensureVisualizationGroups();
  const wanted = new Set(mobileEntities.map(entity => entity.id));
  for (const [id, record] of entityObjects) {
    if (wanted.has(id)) continue;
    if (record.group.parent) record.group.parent.remove(record.group);
    disposeVisualObject(record.group);
    entityObjects.delete(id);
  }
  const now = performance.now();
  for (const entity of mobileEntities) {
    const location = visualLocation(entity);
    if (!location) continue;
    const target = new THREE.Vector3(location.x, location.y, 2);
    let record = entityObjects.get(entity.id);
    if (!record || record.group.userData.entityType !== entity.type) {
      if (record) {
        if (record.group.parent) record.group.parent.remove(record.group);
        disposeVisualObject(record.group);
      }
      const group = createEntityObject(entity);
      group.position.copy(target);
      entityGroups[location.level].add(group);
      record = { group, level: location.level, from: target.clone(), to: target.clone(), start: now, duration: 0 };
      entityObjects.set(entity.id, record);
    } else {
      if (record.level !== location.level) {
        if (record.group.parent) record.group.parent.remove(record.group);
        entityGroups[location.level].add(record.group);
        record.level = location.level;
      }
      record.from = record.group.position.clone();
      record.to = target;
      record.start = now;
      record.duration = Math.max(0, Number(entity.transition_ms) || 0);
    }
    record.group.rotation.z = -(Number(entity.heading) || 0) * Math.PI / 180;
    record.group.userData.mobileEntity = entity;
  }
  render();
}

function doorColor(door) {
  if (door.lock_state === 'jammed') return '#ff8a35';
  if (door.blocked || door.lock_state === 'locked') return '#ff405d';
  if (door.state === 'open') return '#55e6a5';
  return door.kind === 'entrance' || door.kind === 'fire_exit' ? '#4dd9ff' : '#75a7ff';
}

function createDoorObject(door) {
  const color = doorColor(door);
  const group = new THREE.Group();
  const frame = new THREE.Mesh(new THREE.BoxGeometry(5.2, 1.1, 7), translucent(color, 0.88));
  frame.position.z = 3.5;
  group.add(frame);
  if (door.kind === 'entrance' || door.kind === 'fire_exit') {
    const cap = new THREE.Mesh(new THREE.BoxGeometry(7.4, 1.3, 0.8), translucent(color, 0.95));
    cap.position.z = 7.2;
    group.add(cap);
  }
  if (door.lock_state !== 'unlocked') {
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.9, 2.1), translucent('#f8fafc', 0.95));
    body.position.set(0, -0.8, 5.2);
    const shackle = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.28, 8, 18, Math.PI), translucent('#f8fafc', 0.95));
    shackle.rotation.x = Math.PI / 2;
    shackle.position.set(0, -0.8, 6.2);
    group.add(body, shackle);
  }
  if (door.blocked) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(4.2, 4.8, 32), translucent(color, 0.72));
    ring.position.z = 0.5;
    ring.userData.warningPulse = true;
    group.add(ring);
  }
  const label = labelSprite(`${door.kind === 'door' ? '' : door.kind.replace('_', ' ') + ' · '}${door.name}`, color);
  label.position.set(0, -5.2, 7.8);
  group.add(label);
  group.userData.semanticDoor = door;
  return group;
}

function applyDoors(doors) {
  semanticDoors = Array.isArray(doors) ? doors : [];
  ensureVisualizationGroups();
  for (const level of LEVELS) emptyVisualGroup(semanticDoorGroups[level]);
  for (const door of semanticDoors) {
    const location = visualLocation(door);
    if (!location) continue;
    const object = createDoorObject(door);
    object.position.set(location.x, location.y, 2);
    semanticDoorGroups[location.level].add(object);
  }
  const checkbox = document.getElementById('showDoors');
  if (checkbox) for (const level of LEVELS) semanticDoorGroups[level].visible = checkbox.checked;
  render();
}

function applyAlerts(alerts) {
  decisionAlerts = Array.isArray(alerts) ? alerts : [];
  const stack = document.getElementById('alert-stack');
  if (!stack) return;
  stack.replaceChildren();
  for (const alert of decisionAlerts) {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = `decision-alert ${alert.severity}`;
    const eyebrow = document.createElement('span');
    eyebrow.className = 'decision-alert-kind';
    eyebrow.textContent = `${alert.severity}${alert.room ? ' · ' + alert.room : ''}`;
    const title = document.createElement('strong');
    title.textContent = alert.title;
    const message = document.createElement('span');
    message.textContent = alert.message || '';
    card.append(eyebrow, title, message);
    if (alert.room && alert.level) {
      card.title = `Show ${alert.room}`;
      card.addEventListener('click', () => {
        const level = fullVisualLevel(alert.level);
        if (!level) return;
        _lastSearchedRoom = { name: alert.room, level };
        switchToFloor(level);
        syncHud();
      });
    }
    stack.appendChild(card);
  }
}

function updateVisualizationAnimations(now) {
  for (const record of entityObjects.values()) {
    if (record.duration <= 0) continue;
    const t = Math.min(1, (now - record.start) / record.duration);
    const smooth = t * t * (3 - 2 * t);
    record.group.position.lerpVectors(record.from, record.to, smooth);
    if (t >= 1) record.duration = 0;
  }
  for (const level of LEVELS) {
    const group = effectGroups[level];
    if (group) group.traverse(object => {
      if (object.userData.flame) {
        const pulse = 1 + 0.12 * Math.sin(now * 0.008 + object.userData.phase);
        object.scale.set(pulse, pulse, 0.9 + 0.16 * Math.sin(now * 0.011 + object.userData.phase));
      }
      if (object.userData.smoke) {
        const phase = object.userData.phase;
        object.position.x = object.userData.baseX + Math.sin(now * 0.0008 + phase) * 1.4;
        object.position.y = object.userData.baseY + Math.cos(now * 0.00065 + phase) * 1.0;
        object.position.z = object.userData.baseZ + Math.sin(now * 0.0012 + phase) * 1.2;
      }
      if (object.userData.warningPulse) {
        const pulse = 1 + 0.12 * Math.sin(now * 0.006 + (object.userData.phase || 0));
        object.scale.set(pulse, pulse, 1);
        if (object.material) object.material.opacity = 0.35 + 0.35 * Math.abs(Math.sin(now * 0.005));
      }
    });
    const doors = semanticDoorGroups[level];
    if (doors) doors.traverse(object => {
      if (object.userData.warningPulse) {
        const pulse = 1 + 0.1 * Math.sin(now * 0.006);
        object.scale.set(pulse, pulse, 1);
      }
    });
  }
}

async function fetchVisualCollection(endpoint, apply) {
  try {
    const response = await fetch(endpoint);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    apply(await response.json());
  } catch (error) {
    console.warn(`Failed to fetch ${endpoint}:`, error);
  }
}

const visualRefresh = {
  room_layers: () => fetchAndApplyRoomLayers(),
  effects: () => fetchVisualCollection('/api/effects', applyEffects),
  entities: () => fetchVisualCollection('/api/entities', applyEntities),
  room_appearance: () => fetchVisualCollection('/api/room-appearance', applyRoomAppearance),
  alerts: () => fetchVisualCollection('/api/alerts', applyAlerts),
  doors: () => fetchVisualCollection('/api/doors', applyDoors),
};
const visualRefreshState = {};

function scheduleVisualizationRefresh(kind) {
  if (!visualRefresh[kind]) return;
  window._buildsimDiagnostics.visualNotifications = (window._buildsimDiagnostics.visualNotifications || 0) + 1;
  const state = visualRefreshState[kind] || (visualRefreshState[kind] = { timer: null, active: false, pending: false });
  state.pending = true;
  if (state.timer || state.active) return;
  state.timer = setTimeout(async () => {
    state.timer = null;
    if (state.active || !state.pending) return;
    state.pending = false;
    state.active = true;
    window._buildsimDiagnostics.visualRefreshes = (window._buildsimDiagnostics.visualRefreshes || 0) + 1;
    await visualRefresh[kind]();
    state.active = false;
    if (state.pending) scheduleVisualizationRefresh(kind);
  }, 50);
}

async function fetchAllVisualizations() {
  ensureVisualizationGroups();
  await Promise.all(Object.values(visualRefresh).map(fetcher => fetcher()));
}

window.buildsim = Object.assign(window.buildsim || {}, {
  effects: () => [...visualEffects],
  entities: () => [...mobileEntities],
  doors: () => [...semanticDoors],
  alerts: () => [...decisionAlerts],
});



// ---- flight.js ----
// flight.js — moving through the building rather than around it.
//
// Route flight: when a route arrives, the camera can run it at head height,
// easing in and out and banking into the turns, then settle back into the
// overview it came from. While it runs the orbit controller stands down and
// this file drives camera3D directly.

let cameraLocked = false;
let flightAbort = null;

function lockCamera(on) {
  cameraLocked = on;
  orbitControls.enabled = !on && is3DView;
}

// ── route flight ─────────────────────────────────────────────────────────
let routeFlightRunning = false;

function offerRouteFlight() {
  const chip = document.getElementById('routeFlightChip');
  if (chip) {
    chip.style.display = 'flex';
    clearTimeout(chip._t);
    chip._t = setTimeout(() => { chip.style.display = 'none'; }, 14000);
  }
  // A remotely selected route is a request to *show* the way: pull back and
  // frame the whole path so the red line reads at a glance. The head-height
  // fly-through stays one click away on the chip — it was disorienting as the
  // automatic response ("it showed walk mode").
  if (_routeFromRemote) {
    _routeFromRemote = false;
    setTimeout(() => { if (lastRoutePoints) frameRoute(); }, 500);
  }
}

// Pull the camera back to a three-quarter view that holds the whole route,
// with a little margin so the endpoints' markers stay inside the frame.
function frameRoute() {
  if (!lastRoutePoints || lastRoutePoints.length < 2) return;
  if (!is3DView) switchTo3D();
  const bb = new THREE.Box3().setFromPoints(lastRoutePoints);
  const c = bb.getCenter(new THREE.Vector3());
  const size = bb.getSize(new THREE.Vector3());
  const span = Math.max(size.x, size.y, size.z, 60);
  const dist = span * 1.25 + 70;
  const dir = new THREE.Vector3(0.42, -0.62, 0.66).normalize();
  animateCamera3D(c.clone().addScaledVector(dir, dist), c, 1600);
}
function hideRouteFlightChip() {
  const chip = document.getElementById('routeFlightChip');
  if (chip) chip.style.display = 'none';
}
let _routeFromRemote = false;

function flyRoute() {
  if (routeFlightRunning || !lastRoutePoints || lastRoutePoints.length < 2) return;
  if (!is3DView) switchTo3D();
  hideRouteFlightChip();
  const pts = lastRoutePoints.map(p => p.clone());
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
  const total = curve.getLength();
  const back = { pos: camera3D.position.clone(), look: orbitControls.target.clone() };

  routeFlightRunning = true;
  lockCamera(true);
  document.body.classList.add('flying');
  setIndoorLighting(true, null);
  setRouteEyeLevel(true);

  const speed = 26;                        // world units per second
  const dur = Math.min(19000, Math.max(4200, total / speed * 1000));
  const t0 = performance.now();
  const id = ++_animId;
  flightAbort = () => { if (id === _animId) _animId++; endFlight(); };

  const up = new THREE.Vector3(0, 0, 1);
  const eye = new THREE.Vector3(), aim = new THREE.Vector3();
  const d1 = new THREE.Vector3(), d2 = new THREE.Vector3();

  function endFlight() {
    routeFlightRunning = false;
    setRouteEyeLevel(false);
    setIndoorLighting(false);
    document.body.classList.remove('flying');
    camera3D.up.set(0, 0, 1);
    lockCamera(false);
    animateCamera3D(back.pos, back.look, 1500);
  }

  function tick(now) {
    if (id !== _animId) { endFlight(); return; }
    const raw = Math.min((now - t0) / dur, 1);
    // ease in and out so the start and finish don't jerk
    const s = raw < 0.12 ? (raw / 0.12) * (raw / 0.12) * 0.12
            : raw > 0.88 ? 1 - Math.pow((1 - raw) / 0.12, 2) * 0.12
            : raw;
    const t = Math.min(0.999, s);
    curve.getPointAt(t, eye);
    curve.getPointAt(Math.min(0.9995, t + 0.02), aim);
    // Route tubes are drawn ROUTE_Z above the floor so they read over the
    // plan; the camera wants head height above that same floor instead —
    // otherwise it flies out through the ceiling.
    eye.z += EYE_H - ROUTE_Z;
    aim.z += EYE_H * 0.8 - ROUTE_Z;

    // bank: compare the heading a little ahead with the heading a little
    // behind and roll into the difference
    curve.getTangentAt(Math.max(0.0005, t - 0.012), d1);
    curve.getTangentAt(Math.min(0.9985, t + 0.012), d2);
    const turn = Math.atan2(d1.x * d2.y - d1.y * d2.x, d1.x * d2.x + d1.y * d2.y);
    const bank = Math.max(-0.42, Math.min(0.42, turn * 5.5));
    const fwd = d2.clone().normalize();
    up.set(0, 0, 1).applyAxisAngle(fwd, -bank);

    camera3D.position.copy(eye);
    camera3D.up.copy(up);
    camera3D.lookAt(aim);
    orbitControls.target.copy(aim);
    moveHeadLamp();
    render();
    if (raw < 1) requestAnimationFrame(tick);
    else endFlight();
  }
  requestAnimationFrame(tick);
}

// Escape gets you out of the flight, the same key that leaves everything
// else in the viewer.
window.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === 'Escape' && routeFlightRunning && flightAbort) flightAbort();
});



// ---- peel.js ----
// peel.js — opening the building.
//
// The viewer has two poses of the same model. Closed, the floor plates are
// stacked at their true storey height inside the shell and you see A-huset
// from the plaza. Open, the shell has dissolved to a wireframe and the plates
// have separated into the exploded floor stack the rest of the viewer has
// always worked with.
//
// The whole transition is one number, peelT ∈ [0,1]. At peelT = 1 every
// coordinate is exactly what it was before this file existed, so routes,
// highlights, equipment, occupancy and coverage keep their geometry untouched;
// they are simply held back until the building is open.

let peelT = 1;                 // 1 = open (the historical layout)
let peelTarget = 1;
let peelAnim = null;
let _peelAnimId = 0;
const tierGroups = [];
let tiersReady = false;

function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

// Each floor plate hangs off a tier so it can be slid vertically without
// touching any of the coordinates the rest of the viewer computes.
function setupTiers() {
  if (tiersReady) return;
  LEVELS.forEach((l, i) => {
    const tg = new THREE.Group();
    tg.name = 'tier' + i;
    scene.add(tg);
    tierGroups[i] = tg;
    const fg = floorGroups[l];
    if (fg && fg.container) tg.add(fg.container);
  });
  tiersReady = true;
}

// The floor plates are the last act: once the shell is off them they fan out
// downwards, the lowest first, each with a short glow as it reaches its place.
// tierProgress(i, t) is 0 at t = 0 and 1 at t = 1 for every tier, so the two
// end states are bit-for-bit the ones the rest of the viewer expects.
function tierProgress(i, t) {
  const a = 0.44 + i * 0.09;
  const b = Math.min(0.995, a + 0.40);
  const u = clamp01((t - a) / (b - a));
  return u * u * u * (u * (u * 6 - 15) + 10);
}

const tierPulses = [];
function tierPulse(i) {
  if (tierPulses[i]) return tierPulses[i];
  if (!baseRings || !baseRings.length) return null;
  const bb = ringBBox(baseRings[0].pts);
  const m = noTone(new THREE.MeshBasicMaterial({
    color: 0x9fd8ff, transparent: true, opacity: 0, depthWrite: false,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
  const p = new THREE.Mesh(
    new THREE.PlaneGeometry((bb.maxX - bb.minX) * 1.04, (bb.maxY - bb.minY) * 1.04), m);
  p.position.set(bb.cx, bb.cy, i * FLOOR_SPACING - 0.6);
  p.renderOrder = 900;
  p.visible = false;
  tierGroups[i].add(p);
  tierPulses[i] = p;
  return p;
}

function setPeel(t) {
  peelT = clamp01(t);
  const squeeze = FLOOR_SPACING - EXT_STOREY;
  for (let i = 0; i < tierGroups.length; i++) {
    if (!tierGroups[i]) continue;
    const p = tierProgress(i, peelT);
    tierGroups[i].position.z = -(1 - p) * i * squeeze;
    const pulse = tierPulse(i);
    if (pulse) {
      const g = clamp01((p - 0.70) / 0.30);
      const v = 4 * g * (1 - g) * 0.30;
      pulse.material.opacity = v;
      pulse.visible = v > 0.005 && is3DView;
    }
  }
  setShellPeel(peelT);

  // Hide the plates entirely while the building is shut: they are invisible
  // behind the facade anyway, and dropping ~1000 draw calls keeps the exterior
  // shot smooth on integrated graphics.
  const platesOn = peelT > 0.035 || !is3DView;
  LEVELS.forEach(l => {
    const fg = floorGroups[l];
    if (!fg || !fg.container) return;
    fg.container.visible = fg.container.userData._wantVisible !== false && platesOn;
  });
  gateOverlays();
}

// Overlays are only meaningful once the plates are in their final positions,
// so they sit out the transition and come back at the end.
function gateOverlays() {
  const open = peelT > 0.965;
  const chk = id => { const e = document.getElementById(id); return e ? e.checked : false; };
  if (typeof routeGroup !== 'undefined') routeGroup.visible = open;
  if (typeof occupancyGroup !== 'undefined') occupancyGroup.visible = open;
  if (typeof coverageGroup !== 'undefined') coverageGroup.visible = open;
  if (typeof crossFloorGraphGroup !== 'undefined') crossFloorGraphGroup.visible = open && chk('showGraph');
  if (typeof stairConnectors !== 'undefined') stairConnectors.visible = open && is3DView && chk('showStairs');
  if (typeof elevatorConnectors !== 'undefined') elevatorConnectors.visible = open && is3DView && chk('showElevators');
  if (typeof beaconGroup !== 'undefined') beaconGroup.visible = open && is3DView;
  updateBuildingButton();
}

// switchTo3D / switchToFloor set container visibility for their own reasons;
// remember what they wanted so the peel gate can restore it.
function noteWantVisible(level, v) {
  const fg = floorGroups[level];
  if (fg && fg.container) fg.container.userData._wantVisible = v;
}

const reducedMotion = () => {
  try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch (e) { return false; }
};

function animatePeel(target, duration, onDone) {
  const from = peelT;
  const to = clamp01(target);
  if (Math.abs(to - from) < 0.001) { setPeel(to); if (onDone) onDone(); return; }
  if (reducedMotion()) {                       // an instant cut, no gesture
    peelAnim = ++_peelAnimId;
    peelTarget = to;
    setPeel(to);
    peelAnim = null;
    render();
    if (onDone) onDone();
    return;
  }
  const t0 = performance.now();
  // Deliberately NOT _animId: that counter belongs to the camera tweens, and
  // bumping it here cancelled the very camera move the peel is choreographed
  // with, leaving the building to open in front of a motionless camera.
  const id = ++_peelAnimId;
  peelAnim = id;
  peelTarget = to;
  function tick(now) {
    if (peelAnim !== id) return;              // superseded
    const raw = Math.min((now - t0) / duration, 1);
    // easeInOutQuint — slow to commit, slow to settle, quick in between
    const e = raw < 0.5 ? 16 * raw * raw * raw * raw * raw
                        : 1 - Math.pow(-2 * raw + 2, 5) / 2;
    setPeel(from + (to - from) * e);
    render();
    if (raw < 1) requestAnimationFrame(tick);
    else { peelAnim = null; if (onDone) onDone(); }
  }
  requestAnimationFrame(tick);
}

// ── camera poses ─────────────────────────────────────────────────────────
function buildingCenter() {
  if (baseRings && baseRings.length) {
    const bb = ringBBox(baseRings[0].pts);
    return new THREE.Vector3(bb.cx, bb.cy, 0);
  }
  return new THREE.Vector3(0, 0, 0);
}

function overviewShot() {
  const c = buildingCenter();
  const zTop = (LEVELS.length - 1) * FLOOR_SPACING;
  const span = baseRings && baseRings.length
    ? (() => { const b = ringBBox(baseRings[0].pts); return Math.max(b.maxX - b.minX, b.maxY - b.minY); })()
    : 400;
  const dist = span * 1.02;
  // A shallow angle so the plates read as a stack rather than as one plan.
  const dir = new THREE.Vector3(0.50, -0.80, 0.42).normalize();
  const look = new THREE.Vector3(c.x, c.y, zTop * 0.5);
  return { pos: look.clone().addScaledVector(dir, dist), look };
}

function roomShot(level, roomName, tightness) {
  const data = floorData[level];
  if (!data) return null;
  const room = data.rooms.find(r => r.name === roomName);
  if (!room) return null;
  const [wx, wy] = pdfToWorld(room.center[0], room.center[1], data.page.width, data.page.height);
  const zi = LEVELS.indexOf(level) * FLOOR_SPACING;
  const d = tightness || 110;
  return {
    pos: new THREE.Vector3(wx + d * 0.62, wy - d * 0.72, zi + d * 0.62),
    look: new THREE.Vector3(wx, wy, zi + 2),
  };
}

// ── the two gestures ─────────────────────────────────────────────────────
let viewMode = 'exterior';     // 'exterior' | 'interior'

function openBuilding(opts) {
  const o = opts || {};
  if (!is3DView) {                 // the flat floor view is always "open"
    if (o.then) o.then();
    return;
  }
  // "already open" has to mean open and staying open: a close that is still
  // playing has to be answered with a real animation back, or the running
  // gesture carries on and shuts the building behind us.
  const wasClosed = peelT < 0.9 || (peelAnim !== null && peelTarget < 0.5);
  viewMode = 'interior';
  if (!wasClosed) {
    setPeel(1);
    if (o.then) o.then();
    else if (o.frame) { const s = overviewShot(); animateCamera3D(s.pos, s.look, 900); }
    return;
  }
  const dur = o.duration || 2300;
  const shot = o.shot || overviewShot();
  if (!o.still) swingCamera(shot, dur);
  animatePeel(1, dur, () => {
    gateOverlays();
    if (o.then) o.then();
  });
  updateBuildingButton();
}

// The camera takes a short arc round the building while it transforms, rather
// than sliding to the new pose in a straight line: the swing is what makes the
// opening read as the building turning itself inside out. It is one extra leg,
// and it is abandoned the moment another peel is asked for.
function swingCamera(shot, dur) {
  if (reducedMotion()) {
    animateCamera3D(shot.pos, shot.look, Math.max(200, dur * 0.4));
    return;
  }
  const c = buildingCenter();
  const from = camera3D.position.clone();
  const mid = from.clone().sub(c);
  const a = 0.42;                                  // ~24° of orbit
  const mx = mid.x * Math.cos(a) - mid.y * Math.sin(a);
  const my = mid.x * Math.sin(a) + mid.y * Math.cos(a);
  mid.set(mx, my, mid.z);
  const midPos = c.clone().add(mid.multiplyScalar(1.06));
  midPos.z = from.z + (shot.pos.z - from.z) * 0.45 + 26;
  const midLook = orbitControls.target.clone().lerp(shot.look, 0.45);
  const id = _peelAnimId + 1;                      // the peel about to be armed
  animateCamera3D(midPos, midLook, dur * 0.5);
  setTimeout(() => {
    if (_peelAnimId !== id) return;                // a newer gesture took over
    animateCamera3D(shot.pos, shot.look, dur * 0.52);
  }, dur * 0.46);
}

function closeBuilding(opts) {
  const o = opts || {};
  if (!is3DView) switchTo3D();
  viewMode = 'exterior';
  const shot = heroCameraShot();
  const dur = o.duration || 2000;
  if (!o.still) swingCamera(shot, dur);
  animatePeel(0, dur * 0.92, () => { gateOverlays(); if (o.then) o.then(); });
  updateBuildingButton();
}

function toggleBuilding() {
  // Manual toggle: the building transforms, the viewpoint stays put.
  if (peelT > 0.5) closeBuilding({ still: true }); else openBuilding({ still: true });
}

function updateBuildingButton() {
  const b = document.getElementById('btnBuilding');
  if (!b) return;
  const closed = peelT < 0.5;
  b.classList.toggle('on', closed);
  b.title = closed ? 'Open the building and show the floor plates'
                   : 'Close the building and view it from the plaza';
}

// ── hook the existing behaviours ─────────────────────────────────────────
// Everything below keeps the original function's semantics and only decides
// whether the building has to open first.

const _peel_applyViewport = applyViewport;
applyViewport = function (vp) {
  if (!vp) return;
  if (vp.mode === '2d' || (!is3DView && vp.mode !== '3d')) { _peel_applyViewport(vp); return; }
  if (peelT > 0.9) { _peel_applyViewport(vp); return; }
  // Opening straight onto the requested room reads as one continuous move.
  let shot = null;
  if (vp.room) {
    for (const l of LEVELS) {
      const s = roomShot(l, vp.room, 150 / (vp.zoom || 1));
      if (s) { shot = s; break; }
    }
  }
  openBuilding({ shot: shot || overviewShot(), then: () => _peel_applyViewport(vp) });
};

const _peel_applyHighlights = applyHighlights;
applyHighlights = function (h) {
  const draw = () => {
    _peel_applyHighlights(h);
    buildHighlightBeacons();
    if (h && h.length && is3DView) frameHighlights();
  };
  if (h && h.length && is3DView && peelT < 0.9) { openBuilding({ then: draw }); return; }
  draw();
};

// In the stacked view a highlighted room on a lower floor sits under the plate
// above it, so colouring the floor alone can leave a requested room invisible.
// Each highlight also gets a marker standing clear of the whole stack with a
// thread down to the room it belongs to.
const beaconGroup = new THREE.Group();
beaconGroup.name = 'highlight-beacons';
scene.add(beaconGroup);
let beaconPinTex = null;

function beaconTexture() {
  if (beaconPinTex) return beaconPinTex;
  const c = texCanvas(64, 64);
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 1, 32, 32, 31);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.75)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  beaconPinTex = new THREE.CanvasTexture(c);
  return beaconPinTex;
}

function clearBeacons() {
  while (beaconGroup.children.length) {
    const c = beaconGroup.children[0];
    beaconGroup.remove(c);
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
  }
}

function highlightedRooms() {
  const out = [];
  LEVELS.forEach((l, li) => {
    const fg = floorGroups[l], data = floorData[l];
    if (!fg || !data) return;
    // A storey switched off in the floor filter has no beacon either.
    if (typeof floorVisible === 'function' && is3DView && !floorVisible(li)) return;
    for (const m of fg.meshes) {
      if (!m.userData.highlighted) continue;
      const r = data.rooms.find(rr => rr.id === m.userData.id) || m.userData;
      if (!r || !r.center) continue;
      const [wx, wy] = pdfToWorld(r.center[0], r.center[1], data.page.width, data.page.height);
      // floorLift is the floor filter's spread: a beacon is drawn in world
      // space rather than inside the floor, so it has to be lifted by hand.
      const lift = typeof floorLift === 'function' && is3DView ? floorLift(li) : 0;
      out.push({ x: wx, y: wy, z: li * FLOOR_SPACING + lift, level: l, li,
                 color: m.material.color.clone(), name: r.name });
    }
  });
  return out;
}

function buildHighlightBeacons() {
  clearBeacons();
  if (!is3DView) { render(); return; }
  const hs = highlightedRooms();
  if (!hs.length) { render(); return; }
  const topLift = typeof floorLift === 'function' && is3DView ? floorLift(LEVELS.length - 1) : 0;
  const topZ = (LEVELS.length - 1) * FLOOR_SPACING + topLift + 26;
  for (const h of hs) {
    const mat = noTone(new THREE.LineBasicMaterial({
      color: h.color, transparent: true, opacity: 0.55, depthTest: false }));
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(h.x, h.y, h.z + 2), new THREE.Vector3(h.x, h.y, topZ)]);
    const line = new THREE.Line(geo, mat);
    line.renderOrder = 1200;
    beaconGroup.add(line);
    const pin = new THREE.Sprite(noTone(new THREE.SpriteMaterial({
      map: beaconTexture(), color: h.color, transparent: true,
      depthTest: false, depthWrite: false, opacity: 0.95 })));
    pin.position.set(h.x, h.y, topZ);
    pin.scale.set(8, 8, 1);
    pin.renderOrder = 1201;
    beaconGroup.add(pin);
  }
  render();
}

function frameHighlights() {
  const hs = highlightedRooms();
  if (!hs.length) return;
  // Pad the cloud so a row of rooms doesn't collapse to a sliver and pull the
  // camera in on top of them.
  const pts = hs.map(h => new THREE.Vector3(h.x, h.y, h.z));
  let cx = 0, cy = 0, cz = 0;
  for (const p of pts) { cx += p.x; cy += p.y; cz += p.z; }
  cx /= pts.length; cy /= pts.length; cz /= pts.length;
  const pad = 44;
  pts.push(new THREE.Vector3(cx + pad, cy + pad, cz + 14));
  pts.push(new THREE.Vector3(cx - pad, cy - pad, cz - 10));
  fitCameraToRoute(pts);
}

const _peel_applyRoute = applyRoute;
applyRoute = function (route) {
  const draw = () => {
    _peel_applyRoute(route);
    if (route && route.path && route.path.length > 2) offerRouteFlight();
  };
  if (route && route.path && route.path.length > 1 && is3DView && peelT < 0.9) {
    openBuilding({ then: draw });
  } else draw();
};

const _peel_switchTo3D = switchTo3D;
switchTo3D = function () {
  _peel_switchTo3D();
  LEVELS.forEach(l => noteWantVisible(l, true));
  setWorldVisible(true);
  if (typeof shellGroup !== 'undefined') shellGroup.visible = true;
  if (tiersReady) setPeel(peelT);
  syncHudSafe();
};

const _peel_switchToFloor = switchToFloor;
switchToFloor = function (level) {
  // A single flat floor is the fully-open state by definition.
  if (tiersReady) setPeel(1);
  viewMode = 'interior';
  _peel_switchToFloor(level);
  LEVELS.forEach(l => noteWantVisible(l, l === level));
  // grass, trees and sky have no place behind a drawing
  setWorldVisible(false);
  if (tiersReady) setPeel(1);
  // after setPeel: it decides shell visibility from the peel value, and a flat
  // floor plan wants no ghost wireframe of the exterior over it
  if (typeof shellGroup !== 'undefined') shellGroup.visible = false;
  syncHudSafe();
};

function syncHudSafe() { if (typeof syncHud === 'function') syncHud(); }

const _peel_searchAndZoom = searchAndZoom;
searchAndZoom = function (roomName, level) {
  if (is3DView && peelT < 0.9) {
    const shot = roomShot(level, roomName, 120);
    openBuilding({ shot: shot || overviewShot(), then: () => _peel_searchAndZoom(roomName, level) });
    return;
  }
  _peel_searchAndZoom(roomName, level);
};

// ── boot ─────────────────────────────────────────────────────────────────
const _peel_init = init;
init = async function () {
  // The first thing on screen must be the building, not the naked floor
  // plates it is compiled from: keep the canvas dark until the shell is
  // closed, then let the finished frame fade in. The loading screen owns the
  // dark, and hands it over on the same fade — one moment, not two.
  renderer.domElement.style.opacity = '0';
  try {
    await _peel_init();
    try {
      buildShell();
    } catch (e) { console.warn('[shell] build failed:', e); }
    bootProgress(1, 'Raising the facade');
    setupTiers();
    LEVELS.forEach(l => noteWantVisible(l, true));
    buildInteriorDetail();
    startLiveLayers();
    buildHud();
    bootProgress(1, 'Fitting out the interior');
    // Open on the plaza, the way you meet the building in person.
    const shot = heroCameraShot();
    camera3D.position.copy(shot.pos);
    orbitControls.target.copy(shot.look);
    orbitControls.minDistance = 6;
    orbitControls.maxDistance = 1600;
    orbitControls.update();
    setPeel(0);
    viewMode = 'exterior';
    updateBuildingButton();
    requestShadowUpdate();
    render();
    bootProgress(1, 'A-huset');
  } finally {
    // Whatever happened above, the screen is handed over: a loader that
    // sticks is worse than a half-built building you can still orbit.
    renderer.domElement.style.transition = 'opacity 420ms ease';
    renderer.domElement.style.opacity = '1';
    bootFinish();
  }
};



// ---- hud.js ----
// hud.js — the controls that sit on top of the view.
//
// One bar, thumb-reachable on a phone and unobtrusive on a desktop: which
// pose of the building you're looking at, which floor, and which live layers
// are on. Geometry toggles and explicitly selectable room heatmaps sit behind
// the Layers button.

let hudBuilt = false;

function buildHud() {
  if (hudBuilt) return;
  hudBuilt = true;

  const btn = id => document.getElementById(id);

  // ── floor chips ──
  const chips = btn('hudFloors');
  if (chips) {
    const mk = (label, title, fn) => {
      const b = document.createElement('button');
      b.className = 'hud-chip';
      b.textContent = label;
      b.title = title;
      b.addEventListener('click', fn);
      chips.appendChild(b);
      return b;
    };
    hudChip3D = mk('3D', 'Stacked floor plates', () => { switchTo3D(); openBuilding({ still: true }); syncHud(); });
    BLDG.levels.forEach((l, i) => {
      hudChipFloor[i] = mk(BLDG.labels[i].replace('Floor ', 'F'), BLDG.labels[i],
        () => { switchToFloor(currentBuilding + '/' + l); syncHud(); });
    });
  }

  btn('btnBuilding').addEventListener('click', () => { toggleBuilding(); syncHud(); });
  btn('btnLayers').addEventListener('click', () => toggleHudPop('layers'));
  btn('btnFind').addEventListener('click', () => {
    toggleHudPop('find');
    if (hudPopOpen === 'find') document.getElementById('searchRoom').focus();
  });
  btn('btnRoute').addEventListener('click', () => {
    toggleHudPop('route');
    if (hudPopOpen === 'route') document.getElementById('routeFrom').focus();
  });
  const cardX = document.getElementById('room-card-close');
  if (cardX) cardX.addEventListener('click', () => hideRoomCard());
  const fly = document.getElementById('routeFlightGo');
  if (fly) fly.addEventListener('click', () => flyRoute());
  const flyX = document.getElementById('routeFlightNo');
  if (flyX) flyX.addEventListener('click', () => hideRouteFlightChip());

  syncHud();
}

let hudChip3D = null;
const hudChipFloor = [];

function syncHud() {
  renderRoomLayerButtons();
  if (hudChip3D) hudChip3D.classList.toggle('on', is3DView);
  hudChipFloor.forEach((b, i) => {
    b.classList.toggle('on', !is3DView && currentLevel === LEVELS[i]);
  });
  updateBuildingButton();
  updateHeatLegend();
}

// ── popovers off the bar ─────────────────────────────────────────────────
// Find, Route and Layers each hang a small card just above their button.
// Only one is ever out: they are all the same drawer, and two of them open at
// once is a menu, which is the thing this bar replaced. A click anywhere else
// or Escape puts the drawer back.
const HUD_POPS = {
  find: ['btnFind', 'findPop'],
  route: ['btnRoute', 'routePop'],
  layers: ['btnLayers', 'controls'],
};
let hudPopOpen = null;

function placeHudPop(pop, button) {
  const host = document.getElementById('viewer-container');
  if (!host) return;

  const br = button.getBoundingClientRect();
  const w = pop.offsetWidth || 260;
  const half = Math.min(w, hr.width - 20) / 2;
  let cx = br.left + br.width / 2 - hr.left;
  cx = Math.max(half + 10, Math.min(hr.width - half - 10, cx));
  pop.style.left = cx + 'px';
}

// ---- floors.js ----
// floors.js — pulling the stack apart, and putting storeys away.
//
// Two ways to get at a floor that is buried under the ones above it, both
// live only in the open 3D building:
//
//   · spread — the whole stack fans out vertically. Level 0 stays where the
//     building meets the ground, level 1 lifts, level 2 lifts twice as far,
//     so the storeys separate without the plan drifting sideways. It is a
//     drag, not a slider you hunt for: the rail on the right edge, or a
//     vertical drag on any floor plate itself.
//   · filter — an eye chip per storey. Hidden floors leave the scene
//     entirely, so you can isolate level 1 and read it against the site.
//
// Both are pure presentation: they move the tier groups peel.js already
// hangs each floor off, and nothing that computes a coordinate anywhere else
// in the viewer knows they exist. Everything that lives *inside* a floor —
// room meshes, walls, slab, labels, equipment sprites, the heat overlay —
// is parented to that floor's container and rides along for free. The few
// things that span storeys (the route tube, coverage domes, stair and
// elevator connectors) cannot ride two floors at once, so they stand down
// while the stack is spread and come back when it closes.

const EXPLODE_GAP = 45;        // extra height between plates at full spread
const EXPLODE_DRAG = 300;      // px of drag for the full spread
const EXPLODE_TAU = 90;        // ms; how hard the stack chases the target

let explodeT = 0;              // 0 = the storeys at their built spacing
let explodeTarget = 0;
let explodeRAF = 0;
const floorShown = LEVELS.map(() => true);
const tierBase = LEVELS.map(() => 0);   // where the peel wants each tier

// How far storey i is lifted right now. peel.js asks this when it places the
// highlight beacons, which are drawn in world space rather than inside a
// floor, so they have to be lifted by hand.
function floorLift(i) { return i * EXPLODE_GAP * explodeT; }
function floorVisible(i) { return floorShown[i] !== false; }

// ── the stack ────────────────────────────────────────────────────────────
// setPeel owns the tier positions; this rides on top of whatever it decided,
// so opening and closing the building keeps working untouched.
const _fl_setPeel = setPeel;
setPeel = function (t) {
  _fl_setPeel(t);
  for (let i = 0; i < tierGroups.length; i++) {
    if (tierGroups[i]) tierBase[i] = tierGroups[i].position.z;
  }
  layoutFloors();
};

function layoutFloors() {
  if (!tiersReady) return;
  for (let i = 0; i < tierGroups.length; i++) {
    const tg = tierGroups[i];
    if (!tg) continue;
    tg.position.z = tierBase[i] + floorLift(i);
    // A filtered-out storey leaves the scene whole — plates, walls, equipment
    // and all — but only in 3D: the flat plan shows one floor by other means.
    tg.visible = !is3DView || floorVisible(i);
  }
  syncFloorRail();
}

// Anything drawn across two storeys is wrong the moment they move apart, so
// it waits out the spread — except the route, which is rebuilt with each node
// lifted by its own storey (see refreshSpreadRoute), so it stays visible and
// stretches between the separated floors. gateOverlays() is what turns the
// rest back on, so it is also where they get taken away again.
const _fl_gateOverlays = gateOverlays;
gateOverlays = function () {
  _fl_gateOverlays();
  if (is3DView && explodeT > 0.005) {
    if (typeof coverageGroup !== 'undefined') coverageGroup.visible = false;
    if (typeof occupancyGroup !== 'undefined') occupancyGroup.visible = false;
    if (typeof crossFloorGraphGroup !== 'undefined') crossFloorGraphGroup.visible = false;
    if (typeof stairConnectors !== 'undefined') stairConnectors.visible = false;
    if (typeof elevatorConnectors !== 'undefined') elevatorConnectors.visible = false;
  }
  syncFloorRail();
};

// The route tube is one geometry across storeys, so it cannot be translated —
// it is rebuilt from the last result with each node at its lifted height.
// Cheap enough to do per animation tick (a few thousand triangles).
function refreshSpreadRoute() {
  if (typeof lastRouteResult === 'undefined' || !lastRouteResult) return;
  if (typeof routeGroup === 'undefined' || !routeGroup.visible) return;
  while (routeGroup.children.length > 0) {
    const c = routeGroup.children[0];
    routeGroup.remove(c);
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
  }
  renderSmoothRoute(lastRouteResult, lastRouteLevelKey);
}

function applyExplode() {
  layoutFloors();
  gateOverlays();
  // Beacons are built in world space against the stack's current height.
  if (beaconGroup.children.length) buildHighlightBeacons();
  refreshSpreadRoute();
  render();
}

// The stack always eases toward the target, whether the target came from a
// drag, a chip or a script: a floor that snapped 45 units in one frame reads
// as a glitch rather than as a movement.
function setExplode(t, immediate) {
  const to = clamp01(is3DView ? t : 0);
  explodeTarget = to;
  if (immediate || reducedMotion()) {
    explodeT = to;
    if (explodeRAF) { cancelAnimationFrame(explodeRAF); explodeRAF = 0; }
    applyExplode();
    return;
  }
  if (explodeRAF) return;
  // Time-based smoothing rather than a fixed fraction per frame: the stack
  // then takes the same fifth of a second to settle whether the machine is
  // drawing at 120 fps or at 8.
  let last = performance.now();
  const tick = (now) => {
    const dt = Math.min(120, Math.max(1, now - last));
    last = now;
    const d = explodeTarget - explodeT;
    if (Math.abs(d) < 0.0015) { explodeT = explodeTarget; explodeRAF = 0; applyExplode(); return; }
    explodeT += d * (1 - Math.exp(-dt / EXPLODE_TAU));
    applyExplode();
    explodeRAF = requestAnimationFrame(tick);
  };
  explodeRAF = requestAnimationFrame(tick);
}

// A null list means "the flags have already been set, just apply them".
function setFloorsShown(list) {
  if (Array.isArray(list)) {
    let any = false;
    LEVELS.forEach((l, i) => { if (list[i]) any = true; });
    LEVELS.forEach((l, i) => { floorShown[i] = any ? !!list[i] : true; });
  }
  layoutFloors();
  if (beaconGroup.children.length) buildHighlightBeacons();
  render();
}

// Leaving 3D, closing the building or flying a route all have to land on a
// stack that is whole and closed: a half-spread building with two storeys
// switched off is a state nothing else in the viewer knows how to draw.
function resetFloors(immediate) {
  LEVELS.forEach((l, i) => { floorShown[i] = true; });
  setExplode(0, immediate);
  layoutFloors();
  if (beaconGroup.children.length) buildHighlightBeacons();
}

// ── the rail ─────────────────────────────────────────────────────────────
const railEl = document.getElementById('floorRail');
const trackEl = document.getElementById('explodeTrack');
const fillEl = document.getElementById('explodeFill');
const knobEl = document.getElementById('explodeKnob');
const eyesEl = document.getElementById('floorEyes');
const floorEyeBtns = [];
const KNOB_H = 18;

const EYE_ON = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M1.8 10S4.9 4.9 10 4.9 18.2 10 18.2 10 15.1 15.1 10 15.1 1.8 10 1.8 10z"/><circle cx="10" cy="10" r="2.4"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4.4 16 15.6"/><path d="M7.4 5.6A8.6 8.6 0 0 1 10 5.2c5.1 0 8.2 5 8.2 5a15 15 0 0 1-3 3.4M5 6.9A15 15 0 0 0 1.8 10.2s3.1 5 8.2 5a8.4 8.4 0 0 0 3-.5"/></svg>';

function buildFloorRail() {
  if (!eyesEl || floorEyeBtns.length) return;
  // Top storey first, so the column reads the way the building stands.
  for (let i = LEVELS.length - 1; i >= 0; i--) {
    const b = document.createElement('button');
    b.className = 'floor-eye on';
    b.dataset.level = String(i);
    b.innerHTML = EYE_ON + '<span>L' + i + '</span>';
    b.title = 'Show or hide level ' + i + ' (at least one stays on)';
    b.addEventListener('click', () => toggleFloorShown(i));
    eyesEl.appendChild(b);
    floorEyeBtns[i] = b;
  }
  wireExplodeRail();
  syncFloorRail();
}

function toggleFloorShown(i) {
  const want = !floorShown[i];
  // At least one storey is always on: with none of them the viewer is an
  // empty site and there is nothing to click your way back from.
  if (!want && floorShown.filter(Boolean).length <= 1) return;
  floorShown[i] = want;
  setFloorsShown(null);
}

function syncFloorRail() {
  if (!railEl) return;
  const open = is3DView && typeof peelT === 'number' && peelT > 0.9
    && !(typeof routeFlightRunning !== 'undefined' && routeFlightRunning);
  railEl.classList.toggle('hidden', !open);
  if (!open) return;
  for (let i = 0; i < floorEyeBtns.length; i++) {
    const b = floorEyeBtns[i];
    if (!b) continue;
    const on = floorVisible(i);
    b.classList.toggle('on', on);
    b.classList.toggle('off', !on);
    const svg = b.querySelector('svg');
    if (svg && b._eye !== on) {
      b.innerHTML = (on ? EYE_ON : EYE_OFF) + '<span>L' + i + '</span>';
      b._eye = on;
    }
  }
  if (trackEl && knobEl && fillEl) {
    const travel = trackEl.clientHeight - KNOB_H;
    knobEl.style.bottom = (explodeT * travel) + 'px';
    fillEl.style.height = (explodeT * travel + KNOB_H / 2) + 'px';
    trackEl.setAttribute('aria-valuenow', Math.round(explodeT * 100));
    railEl.classList.toggle('spread', explodeT > 0.005);
  }
}

function railValue(ev) {
  const r = trackEl.getBoundingClientRect();
  const travel = r.height - KNOB_H;
  if (travel <= 0) return 0;
  return clamp01(1 - ((ev.clientY - r.top) - KNOB_H / 2) / travel);
}

function wireExplodeRail() {
  if (!trackEl) return;
  let dragId = null;
  trackEl.addEventListener('pointerdown', (ev) => {
    ev.preventDefault();
    ev.stopPropagation();
    dragId = ev.pointerId;
    try { trackEl.setPointerCapture(ev.pointerId); } catch (e) { /* mouse without capture */ }
    trackEl.classList.add('dragging');
    setExplode(railValue(ev));
  });
  trackEl.addEventListener('pointermove', (ev) => {
    if (dragId !== ev.pointerId) return;
    setExplode(railValue(ev));
  });
  const end = (ev) => {
    if (dragId !== ev.pointerId) return;
    dragId = null;
    trackEl.classList.remove('dragging');
  };
  trackEl.addEventListener('pointerup', end);
  trackEl.addEventListener('pointercancel', end);
  trackEl.addEventListener('keydown', (ev) => {
    const step = ev.shiftKey ? 0.25 : 0.1;
    if (ev.key === 'ArrowUp' || ev.key === 'ArrowRight') setExplode(explodeTarget + step);
    else if (ev.key === 'ArrowDown' || ev.key === 'ArrowLeft') setExplode(explodeTarget - step);
    else if (ev.key === 'Home') setExplode(1);
    else if (ev.key === 'End') setExplode(0);
    else return;
    ev.preventDefault();
  });
}

// ── dragging the plates themselves ───────────────────────────────────────
// The rail is the visible affordance; this is the one people reach for first.
// A press on a floor plate is held back from OrbitControls until the gesture
// has declared itself: pull up or down and the stack spreads, move sideways
// and the press is handed straight back to the orbiter at the point it went
// down, so a rotation loses nothing but the first five pixels. Pan (right
// button) and zoom (wheel) never come through here at all.
let plateDrag = null;
let synthesising = false;

// Anything you can actually see inside a tier counts as that floor: the slab,
// a room, a wall, a label. Three's raycaster happily reports objects that are
// switched off (the peel's flash planes cover the whole footprint), so the
// hit has to be checked back up its parents before it means anything.
function plateUnderPointer(ev) {
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera3D);
  const tiers = tierGroups.filter((t, i) => t && t.visible && floorVisible(i));
  if (!tiers.length) return false;
  for (const h of raycaster.intersectObjects(tiers, true)) {
    let o = h.object, on = true;
    while (o) { if (o.visible === false) { on = false; break; } o = o.parent; }
    if (on) return true;
  }
  return false;
}

viewerEl.addEventListener('pointerdown', (ev) => {
  if (synthesising || plateDrag) return;
  if (ev.button !== 0 || ev.pointerType === 'touch') return;
  if (ev.target !== canvas) return;
  if (!is3DView || peelT < 0.9) return;
  if (typeof editModeEnabled !== 'undefined' && editModeEnabled) return;
  if (typeof routeFlightRunning !== 'undefined' && routeFlightRunning) return;
  if (!plateUnderPointer(ev)) return;
  plateDrag = { id: ev.pointerId, x: ev.clientX, y: ev.clientY, from: explodeTarget, mode: null };
  ev.stopPropagation();                    // the orbiter does not see it yet
}, true);

function handBackToOrbit(ev) {
  const d = plateDrag;
  plateDrag = null;
  synthesising = true;
  try {
    canvas.dispatchEvent(new PointerEvent('pointerdown', {
      pointerId: ev.pointerId, pointerType: ev.pointerType || 'mouse', isPrimary: true,
      button: 0, buttons: 1, clientX: d.x, clientY: d.y,
      bubbles: true, cancelable: true, composed: true, view: window,
    }));
  } catch (e) { /* the gesture is simply lost; the next one works */ }
  synthesising = false;
}

window.addEventListener('pointermove', (ev) => {
  if (!plateDrag || ev.pointerId !== plateDrag.id) return;
  const dx = ev.clientX - plateDrag.x, dy = ev.clientY - plateDrag.y;
  if (!plateDrag.mode) {
    if (Math.hypot(dx, dy) < 5) return;
    if (Math.abs(dy) <= Math.abs(dx) * 1.4) { handBackToOrbit(ev); return; }
    plateDrag.mode = 'spread';
    document.body.classList.add('spreading');
  }
  setExplode(plateDrag.from - dy / EXPLODE_DRAG);
});

function endPlateDrag(ev) {
  if (!plateDrag || (ev && ev.pointerId !== plateDrag.id)) return;
  plateDrag = null;
  document.body.classList.remove('spreading');
}
window.addEventListener('pointerup', endPlateDrag);
window.addEventListener('pointercancel', endPlateDrag);

// ── the states that have to be clean ─────────────────────────────────────
const _fl_switchToFloor = switchToFloor;
switchToFloor = function (level) {
  resetFloors(true);
  _fl_switchToFloor(level);
  layoutFloors();
};

const _fl_switchTo3D = switchTo3D;
switchTo3D = function () {
  _fl_switchTo3D();
  layoutFloors();
};

const _fl_closeBuilding = closeBuilding;
closeBuilding = function (opts) {
  LEVELS.forEach((l, i) => { floorShown[i] = true; });
  setExplode(0);
  _fl_closeBuilding(opts);
};

const _fl_flyRoute = flyRoute;
flyRoute = function () {
  resetFloors(true);
  _fl_flyRoute();
};

// The route rides the spread (each node lifts with its own storey), so a
// route drawn into a spread stack is perfectly visible. The old hook that
// collapsed the stack on every draw is gone: refreshSpreadRoute redraws the
// route on every spread tick, and collapsing there made the drag rubber-band
// back to zero.

const _fl_buildHud = buildHud;
buildHud = function () {
  _fl_buildHud();
  buildFloorRail();
};

const _fl_syncHud = syncHud;
syncHud = function () {
  _fl_syncHud();
  syncFloorRail();
};

// ── the console handle ───────────────────────────────────────────────────
window.buildsim.explode = (t) => {
  if (t === undefined) return explodeT;      // where the stack is right now
  setExplode(t);
  return explodeTarget;
};
window.buildsim.floors = (list) => {
  if (list === undefined) return floorShown.slice();
  setFloorsShown(list);
  return floorShown.slice();
};

// === Equipment search ===
document.getElementById('searchEquipment').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const results = document.getElementById('eqSearchResults');
  if (q.length < 1) { results.innerHTML = ''; return; }

  let matches = equipment.filter(eq =>
    (eq.name && eq.name.toLowerCase().includes(q)) ||
    (eq.type && eq.type.toLowerCase().includes(q)) ||
    (eq.room && eq.room.toLowerCase().includes(q)) ||
    (eq.status && eq.status.toLowerCase().includes(q)) ||
    (eq.id && eq.id.toLowerCase().includes(q))
  ).slice(0, 10);

  const items = matches.map(eq => {
    const sc = eq.status === 'running' ? '#00e676' : eq.status === 'warning' ? '#ffab00' : '#ff1744';
    const levelKey = eq.level;
    const fullLevel = LEVELS.find(l => l.endsWith(levelKey));
    const levelIdx = fullLevel ? LEVELS.indexOf(fullLevel) : 0;
    const item = document.createElement('div');
    item.className = 'pop-item';
    item.style.borderLeft = `3px solid ${sc}`;
    const name = document.createElement('span');
    name.style.color = sc;
    name.textContent = eq.name || eq.id || 'Equipment';
    const location = document.createElement('span');
    location.className = 'pop-dim';
    location.textContent = `${eq.room || '?'} · F${levelIdx}`;
    item.append(name, location);
    item.addEventListener('click', () => window._eqZoom(eq.room, fullLevel || '', eq.id));
    return item;
  });
  results.replaceChildren(...items);
});

document.getElementById('searchEquipment').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const first = document.getElementById('eqSearchResults').querySelector('div');
    if (first) first.click();
  }
});

function _escape(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

window._renderEquipmentInfo = function(eq) {
  if (!eq) return;
  const sc = eq.status === 'running' ? '#00e676' : eq.status === 'warning' ? '#ffab00' : '#ff1744';
  let html = `<b style="color:${sc}">${_escape(eq.name)}</b> <span style="color:${sc}">${_escape((eq.status||'').toUpperCase())}</span>`;
  html += `<br><span style="color:#aaa">Room: ${_escape(eq.level)}/${_escape(eq.room)} | ${_escape(eq.type)}</span>`;
  html += `<br><span style="color:#777">ID: ${_escape(eq.id)}</span>`;

  const sensors = Array.isArray(eq.sensors) ? eq.sensors : [];
  if (sensors.length) {
    html += '<div style="margin-top:7px"><b style="color:#8ab4f8">Sensors</b></div>';
    for (const sensor of sensors) {
      const value = sensor.data_type === 'binary' ? String(Boolean(sensor.binary_value)) : sensor.value;
      html += `<div style="font-size:10px;color:#ddd">${_escape(sensor.name || sensor.id)}: ` +
        `<span style="color:#fff">${_escape(value)}${sensor.unit ? ' ' + _escape(sensor.unit) : ''}</span></div>`;
    }
  }

  const actuators = Array.isArray(eq.actuators) ? eq.actuators : [];
  if (actuators.length) {
    html += '<div style="margin-top:7px"><b style="color:#8ab4f8">Actuators</b></div>';
    for (const actuator of actuators) {
      html += `<div style="font-size:10px;color:#ddd">${_escape(actuator.name || actuator.id)}: ` +
        `<span style="color:#fff">${_escape(actuator.state)}</span></div>`;
    }
  }

  setInfoCard(html, eq.name);
};

window._refreshEquipmentInfo = async function(eqId) {
  try {
    const resp = await fetch(`/api/equipment/${encodeURIComponent(eqId)}?t=${Date.now()}`);
    if (!resp.ok) return;
    const eq = await resp.json();
    // Keep local cache in sync
    const idx = equipment.findIndex(e => e.id === eqId);
    if (idx >= 0) equipment[idx] = eq;
    window._renderEquipmentInfo(eq);
  } catch (e) { console.warn('refresh equipment failed', e); }
};

window._eqZoom = function(roomName, level, eqId) {
  if (level) searchAndZoom(roomName, level);
  window._refreshEquipmentInfo(eqId);
};

window._showEquipmentInfo = function(eq) {
  if (!eq) return;
  window._renderEquipmentInfo(eq);
  window._refreshEquipmentInfo(eq.id);
};

// === Click equipment sprite on map to open info panel ===
(() => {
  let downPos = null;
  canvas.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    downPos = { x: e.clientX, y: e.clientY, t: Date.now() };
  });
  canvas.addEventListener('mouseup', (e) => {
    if (e.button !== 0 || !downPos) return;
    const dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
    const moved = Math.hypot(dx, dy);
    const elapsed = Date.now() - downPos.t;
    downPos = null;
    if (moved > 5 || elapsed > 400) return; // treat as drag, not click

    // 2D clicks on equipment are handled by editor.js mousedown handler
    if (!is3DView) return;

    const rect = canvas.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, activeCamera);

    // Gather all clickable equipment sprites (have attached equipment userData and are visible)
    const sprites = [];
    for (const level in equipmentGroups) {
      const g = equipmentGroups[level];
      if (!g || !g.visible) continue;
      for (const s of g.children) {
        if (!s.visible || !s.isSprite) continue;
        if (!s.userData || !s.userData.equipment) continue;
        sprites.push(s);
      }
    }
    if (sprites.length === 0) return;
    const hits = raycaster.intersectObjects(sprites);
    if (hits.length === 0) return;
    const eq = hits[0].object.userData.equipment;
    window._showEquipmentInfo(eq);
    e.stopPropagation();
  });
})();

window.addEventListener('resize', () => {
  renderer.setSize(viewerW(),viewerH(),false);
  camera3D.aspect=viewerW()/viewerH();camera3D.updateProjectionMatrix();
  updateCamera2D();render();
});

init().catch((error) => {
  console.error('BuildSim viewer failed to start:', error);
  if (bootLabelEl) bootLabelEl.textContent = 'Could not load building data';
  setTimeout(bootFinish, 1500);
});
animate();



// ---- photocam.js ----
// photocam.js — standing where the photographer stood.
//
// The exterior was built against a survey of A-huset: twenty-seven photographs
// with their standpoints marked on the level plan. This puts the render camera
// on those standpoints, at eye height above the local ground, looking the way
// the survey arrow points, through a lens the width of a phone camera — so a
// render and its photograph can be laid side by side and judged.
//
// It is a development aid, reachable as window.buildsim.photoCam(n) or ?photocam=N,
// and it changes nothing about how the viewer behaves otherwise.

// x, y are the standpoints in plan coordinates; heading is degrees measured
// counter-clockwise from +x (plan east). Standpoints came from the numbered
// plan; headings from the arrows where the plan gives one, and otherwise from
// which way the elevation runs in the photograph.
const PHOTO_POSITIONS = {
  1:  { x: 138, y: -172, hdg: 62, back: 16, note: 'SE corner, entrance under the zinc box' },
  2:  { x: -155, y: 190, hdg: -20, note: 'north elevation, looking east' },
  3:  { x: -223, y: 87,  hdg: 0,   note: 'west plaza' },
  4:  { x: 199, y: 128,  hdg: -102, back: 22, note: 'east alley, looking south' },
  5:  { x: 152, y: -13,  hdg: 25,  note: 'east side, Alfa entrance' },
  6:  { x: 36,  y: -180, hdg: 90,  note: 'south elevation' },
  7:  { x: 54,  y: -191, hdg: 62,  note: 'south entrance, zinc box' },
  8:  { x: -230, y: 19,  hdg: 62,  note: 'west lawn — the suterräng section' },
  9:  { x: 168, y: -62,  hdg: 128, back: 16, note: 'east lawn by the university sign' },
  10: { x: 66,  y: -34,  hdg: 64, back: 24, note: 'the plaza front, main entrance' },
  11: { x: -172, y: -191, hdg: 48, note: 'south-west, the preschool wing' },
  13: { x: 202, y: 152,  hdg: -128, back: 8, note: 'east elevation, looking south' },
  14: { x: 19,  y: -191, hdg: 90,  note: 'Universitetsvägen 1' },
  15: { x: 92,  y: 200,  hdg: -24, back: 30, note: 'north elevation by the glass gallery' },
  16: { x: -51, y: -116, hdg: 1,   back: 12, note: 'inner yard, looking east' },
  17: { x: -200, y: 194, hdg: -14, back: 30, note: 'north-west corner, looking east' },
  18: { x: -76, y: -89,  hdg: 22,  note: 'inner yard, looking north-east' },
  19: { x: -225, y: -32, hdg: 12,  note: 'west plaza and the embankment' },
  21: { x: 102, y: -191, hdg: 100, note: 'south-east elevation' },
  22: { x: 196, y: 196,  hdg: -138, back: 30, note: 'north-east glass corner' },
  23: { x: -96, y: -87,  hdg: -133, note: 'inner yard, looking south-west' },
  24: { x: -211, y: -184, hdg: 39, note: 'south-west corner' },
  26: { x: -227, y: 170, hdg: -2,  back: 14, note: 'north-west glass corner, head on' },
  27: { x: -76, y: -200, hdg: 93,  note: 'south yard between the wings' },
  28: { x: -8,  y: -185, hdg: 178, back: 12, note: 'south elevation, looking west' },
  // Synthetic vantages used while judging the massing as a whole.
  90: { x: 200, y: -230, hdg: 118, back: 210, up: 90, tilt: -30, note: 'aerial from the south-east' },
  91: { x: -230, y: 240, hdg: -55, back: 210, up: 90, tilt: -30, note: 'aerial from the north-west' },
  92: { x: 240, y: 190,  hdg: -155, back: 150, up: 30, tilt: 0, note: 'north-east corner, three-quarter' },
  93: { x: -240, y: 60,  hdg: 10,  back: 90,  up: 12, tilt: 6, note: 'the west slope' },
};

// A phone camera is about 26 mm equivalent; on the 4:3 frame these photographs
// use that is a vertical field of view of roughly 46 degrees.
const PHOTO_FOV = 46;

function photoCam(n, opts) {
  const p = PHOTO_POSITIONS[n];
  if (!p) { console.warn('[photocam] no standpoint ' + n); return null; }
  const o = opts || {};
  if (!is3DView) switchTo3D();
  if (typeof setPeel === 'function') setPeel(0);
  if (typeof viewMode !== 'undefined') viewMode = 'exterior';
  const a = (p.hdg * Math.PI) / 180;
  // The plan marks the standpoints against the wall; the photographs are taken
  // from where you actually stand, a bus width further back down the same axis.
  const back = o.back === undefined ? (p.back === undefined ? 20 : p.back) : o.back;
  const ex = p.x - Math.cos(a) * back, ey = p.y - Math.sin(a) * back;
  const g = groundZ(ex, ey);
  const eye = new THREE.Vector3(ex, ey, g + (p.up || 0) + EYE_H);
  // aim a little above the horizon, the way you tilt a phone up at a building
  const look = new THREE.Vector3(
    ex + Math.cos(a) * 70, ey + Math.sin(a) * 70,
    g + (p.up || 0) + EYE_H + (p.tilt === undefined ? 15 : p.tilt));
  // The orbit controller keeps the camera from dropping below its target, so
  // asking it to look *up* at a building would silently lift the camera to the
  // target's height — the difference between standing on the pavement and
  // hovering at first-floor level. Take the controller out of the loop instead.
  if (typeof lockCamera === 'function') lockCamera(true);
  camera3D.fov = o.fov || PHOTO_FOV;
  camera3D.near = 0.4;
  camera3D.updateProjectionMatrix();
  camera3D.position.copy(eye);
  camera3D.up.set(0, 0, 1);
  camera3D.lookAt(look);
  orbitControls.target.copy(
    new THREE.Vector3(ex + Math.cos(a) * 70, ey + Math.sin(a) * 70, eye.z));
  requestShadowUpdate();
  render();
  return p;
}

// A free vantage point, for judging a render against a marked-up screenshot
// whose camera was not one of the survey standpoints.
function freeCam(cfg) {
  const o = cfg || {};
  if (!is3DView) switchTo3D();
  if (typeof setPeel === 'function') setPeel(o.peel || 0);
  if (typeof viewMode !== 'undefined') viewMode = 'exterior';
  if (typeof lockCamera === 'function') lockCamera(true);
  camera3D.fov = o.fov || 50;
  camera3D.near = 0.4;
  camera3D.updateProjectionMatrix();
  camera3D.position.set(o.pos[0], o.pos[1], o.pos[2]);
  camera3D.up.set(0, 0, 1);
  camera3D.lookAt(o.look[0], o.look[1], o.look[2]);
  orbitControls.target.set(o.look[0], o.look[1], o.look[2]);
  requestShadowUpdate();
  render();
  return o;
}

window.buildsim = Object.assign(window.buildsim || {}, {
  photoCam,
  freecam: freeCam,
  // step the transformation by hand, for judging it frame by frame
  setPeel: (t) => { setPeel(t); render(); return t; },
  positions: PHOTO_POSITIONS,
  groundAt: (x, y) => groundZ(x, y),
  ready: () => shellBuilt,
  // handles the render harness uses to check what the generator actually built
  rings: () => levelRings.map(r => r.map(x => {
    const b = ringBBox(x.pts);
    return { n: x.pts.length, area: Math.round(x.area),
             bb: [b.minX, b.minY, b.maxX, b.maxY].map(v => Math.round(v)) };
  })),
  solid: (i, x, y) => !!(levelMasks[i] && levelMasks[i].solid(x, y)),
  // the outer wall run, so a standpoint on a marked-up screenshot can be turned
  // into the wall segment it actually points at
  outerRing: () => baseRings[0].pts.map(p => [+p[0].toFixed(1), +p[1].toFixed(1)]),
  // the same, for any storey's ring — a wall judged on an aerial belongs to the
  // storey it is seen on, not always to the ground floor
  ringPts: (i, j) => ((levelRings[i] || [])[j || 0] || { pts: [] })
    .pts.map(p => [+p[0].toFixed(1), +p[1].toFixed(1)]),
  skin: (i, x, y, nx, ny) => skinFor(i, x, y, nx, ny),
  shell: () => shellGroup,
  // what is under this point of the frame? used when judging a render
  pick: (sx, sy) => {
    const rc = new THREE.Raycaster();
    rc.setFromCamera(new THREE.Vector2(sx, sy), camera3D);
    // The ghost frame is a LineSegments that stays in the scene with its
    // opacity wound down to nothing while the building is closed. It is
    // `visible`, so a raycast hits it and reports a wall where the frame
    // shows sky — which is exactly the wrong answer when the question being
    // asked is "is there a hole in the elevation here?".
    const seen = (h) => h.object.visible && !h.object.isLine &&
      !(h.object.material && h.object.material.transparent &&
        h.object.material.opacity <= 0.02);
    return rc.intersectObjects(scene.children, true)
      .filter(seen)
      .slice(0, 3)
      .map(h => ({ name: h.object.name || h.object.type,
                   parent: h.object.parent && h.object.parent.name,
                   x: +h.point.x.toFixed(1), y: +h.point.y.toFixed(1),
                   z: +h.point.z.toFixed(1), d: +h.distance.toFixed(0) }));
  },
  // what stands over this point of the site? a ray straight down from the sky,
  // so a plan-position judged on a drawing can be turned into what was built
  // there without having to invert a camera.
  probe: (x, y) => {
    const rc = new THREE.Raycaster();
    rc.set(new THREE.Vector3(x, y, 600), new THREE.Vector3(0, 0, -1));
    rc.camera = camera3D;                       // sprites raycast against one
    return rc.intersectObjects(scene.children, true)
      .filter(h => h.object.visible && !h.object.isLine && !h.object.isSprite)
      .slice(0, 10)
      .map(h => ({ name: h.object.name || h.object.type,
                   parent: h.object.parent && h.object.parent.name,
                   z: +h.point.z.toFixed(1) }));
  },
  cam: () => [+camera3D.position.x.toFixed(1), +camera3D.position.y.toFixed(1),
              +camera3D.position.z.toFixed(1)],
  stats: () => renderer.info.render,
});

// The module scope is closed, so a headless regression run cannot reach the
// viewer's own state. Publish exactly what such a run needs to drive and to
// assert, and nothing that changes behaviour.
window.buildsim.dev = {
  get peelT() { return peelT; },
  get peelAnim() { return peelAnim; },
  get peelTarget() { return peelTarget; },
  get viewMode() { return viewMode; },
  get is3DView() { return is3DView; },
  get heatOn() { return heatOn; },
  get heatMetric() { return heatMetric; },
  get peopleOn() { return false; },       // occupant animation was removed
  get levels() { return LEVELS; },
  floorData: () => floorData,
  groups: () => floorGroups,
  routePoints: () => lastRoutePoints,
  counts: () => ({
    beacons: beaconGroup.children.length,
    route: routeGroup.children.length,
    people: 0,
    world: worldGroup.visible, shell: shellGroup.visible,
    spread: Math.round(explodeT * 1000) / 1000,
    floors: floorShown.slice(),
    plates: LEVELS.map(l => !!(floorGroups[l] && floorGroups[l].container.visible)),
    effects: LEVELS.reduce((n, l) => n + (effectGroups[l]?.children.length || 0), 0),
    entities: entityObjects.size,
    doors: LEVELS.reduce((n, l) => n + (semanticDoorGroups[l]?.children.length || 0), 0),
    alerts: decisionAlerts.length,
    lit: LEVELS.reduce((n, l) => n + (floorGroups[l]
      ? floorGroups[l].meshes.filter(m => m.userData.highlighted).length : 0), 0),
  }),
  open: () => new Promise(r => openBuilding({ frame: true, then: r })),
  close: () => new Promise(r => closeBuilding({ then: r })),
  toFloor: (l) => switchToFloor(l),
  frameRoom2D: (roomName, requestedLevel, size) => {
    const level = LEVELS.find(l => l === requestedLevel || l.endsWith('/' + requestedLevel));
    const data = level && floorData[level];
    const room = data && data.rooms.find(r => r.name === roomName);
    if (!room) return false;
    _lastSearchedRoom = { name: roomName, level };
    switchToFloor(level);
    // switchToFloor starts the normal user-facing camera animation. A
    // deterministic test or documentation capture needs its final frame now.
    const [x, y] = pdfToWorld(room.center[0], room.center[1], data.page.width, data.page.height);
    setCamera2DView(x, y, Math.max(20, Math.min(500, Number(size) || 100)));
    return true;
  },
  camera2D: () => ({
    level: currentLevel,
    frustum: frustumSize,
    pan: [panOffset.x, panOffset.y],
    bounds: [camera2D.left, camera2D.right, camera2D.bottom, camera2D.top],
  }),
  to3D: () => switchTo3D(),
  heat: (on, metric) => setHeat(on, metric),
  people: () => false,
  highlights: (h) => applyHighlights(h),
  route: (r) => applyRoute(r),
  camPos: () => camera3D.position.clone(),
  render: () => renderer.info.render,
};

// ?photocam=N puts the viewer straight on that standpoint at load, with the
// controls and the HUD out of the way so the frame is only the building.
(function () {
  const n = parseInt(urlParams.get('photocam') || '', 10);
  if (!n) return;
  const fov = parseFloat(urlParams.get('fov') || '') || undefined;
  const bare = () => {
    const v = document.getElementById('viewer-container');
    if (v) v.style.display = '';
    for (const id of ['hud-bar', 'room-card', 'controls',
                      'findPop', 'routePop', 'floorRail',
                      'buildsim-title', 'liveChip', 'heatLegend']) {
      const e = document.getElementById(id);
      if (e) e.style.display = 'none';
    }
    window.dispatchEvent(new Event('resize'));
  };
  const boot = () => {
    bare();
    if (!shellBuilt) { setTimeout(boot, 150); return; }
    photoCam(n, { fov });
    // one more pass after the textures and the campus have settled
    setTimeout(() => { bare(); photoCam(n, { fov }); window.__photocamReady = true; }, 700);
  };
  setTimeout(boot, 80);
})();



// ---- stack.js ----
// stack.js — the classic stacked-plates view.
//
// Before the exterior existed, the viewer was three flat floor plans hanging
// one above the other in the dark: no facade, no slab, no walls, just the
// drawings. It reads a whole building at a glance in a way the modelled
// version cannot, so it is back as a view of its own rather than as history.
//
// It is not a fourth geometry. The plates are exactly where the open building
// puts them (peelT = 1, tier i at i * FLOOR_SPACING), and everything that
// lives inside a floor container — room polygons, linework, labels, equipment,
// the heat overlay — rides along untouched. The view is subtractive: the
// shell, the campus, the slabs and the extruded partitions are switched off,
// and switched back on again on the way out.

let stackOn = false;
let stackApplying = false;      // our own calls must not trip the exit hooks
let stackPrev = null;           // the mode to come back to

function wallsChecked() {
  const e = document.getElementById('showWalls');
  return e ? e.checked : true;
}

// The subtraction, in one place: called on entry, on exit, and again from
// gateOverlays so that nothing which turns the shell back on for its own
// reasons can leave the exterior standing over the plates.
function applyStackVisibility() {
  LEVELS.forEach(l => {
    const fg = floorGroups[l];
    if (!fg) return;
    if (fg.slabGroup) fg.slabGroup.visible = !stackOn;
    if (fg.extrudeGroup) fg.extrudeGroup.visible = stackOn ? false : wallsChecked();
  });
  if (stackOn) {
    if (typeof shellGroup !== 'undefined') shellGroup.visible = false;
    if (typeof worldGroup !== 'undefined') worldGroup.visible = false;
  }
}

// A shot that holds the whole stack: the same shallow three-quarter angle the
// open building uses, which is what makes the plates read as a stack rather
// than as one plan seen from above — but standing further off. A-huset is a
// long plan, and the overview distance is framed for a building with a facade
// to hide its ends; here the drawings run right to the edge of the frame.
const STACK_BACK = 1.45;

function stackShot() {
  const s = overviewShot();
  const look = s.look.clone();
  const dir = s.pos.clone().sub(look);
  const a = viewerW() / Math.max(1, viewerH());
  const back = STACK_BACK * (a < 1 ? 1.6 : a < 1.4 ? 1.2 : 1);
  return { pos: look.clone().add(dir.multiplyScalar(back)), look };
}

function enterStack() {
  stackPrev = {
    is3D: is3DView,
    level: currentLevel,
    closed: peelT < 0.5 || (peelAnim !== null && peelTarget < 0.5),
  };
  stackApplying = true;
  try {
    if (!is3DView) switchTo3D();
    stackOn = true;
    viewMode = 'interior';
    LEVELS.forEach(l => noteWantVisible(l, true));
    // Hide the exterior before the plates move, so the transition is never a
    // glimpse of the building coming apart.
    applyStackVisibility();
    setPeel(1);                       // also re-runs gateOverlays()
    applyStackVisibility();
  } finally { stackApplying = false; }
  const s = stackShot();
  animateCamera3D(s.pos, s.look, 900);
  syncHud();
  render();
}

// restore = true puts the viewer back where it was before the stack (the chip
// switched off by hand); false only takes the view apart, for the commands
// that are on their way somewhere else themselves.
function exitStack(restore) {
  if (!stackOn) return;
  stackOn = false;
  const prev = stackPrev;
  stackPrev = null;
  applyStackVisibility();
  if (typeof worldGroup !== 'undefined') worldGroup.visible = is3DView;
  if (typeof shellGroup !== 'undefined') shellGroup.visible = is3DView;
  stackApplying = true;
  try {
    setPeel(peelT);                   // hands the shell and the overlays back
    if (restore && prev) {
      if (!prev.is3D && prev.level) switchToFloor(prev.level);
      else if (prev.closed) closeBuilding();
      else { const s = stackShot(); animateCamera3D(s.pos, s.look, 700); }
    }
  } finally { stackApplying = false; }
  syncHud();
  render();
}

function setStack(on) {
  const want = on === undefined ? !stackOn : !!on;
  if (want === stackOn) { if (want) { const s = stackShot(); animateCamera3D(s.pos, s.look, 700); } return; }
  if (want) enterStack(); else exitStack(true);
}

// ── keeping the exterior down ────────────────────────────────────────────
// gateOverlays is the one function every path through the viewer ends in, so
// it is where the subtraction is re-asserted.
const _st_gateOverlays = gateOverlays;
gateOverlays = function () {
  _st_gateOverlays();
  if (!stackOn) return;
  applyStackVisibility();
  if (typeof stairConnectors !== 'undefined') stairConnectors.visible = false;
  if (typeof elevatorConnectors !== 'undefined') elevatorConnectors.visible = false;
};

// ── the ways out ─────────────────────────────────────────────────────────
// Building, 3D and the floor chips all mean "somewhere else": the stack comes
// down first and the command then runs exactly as it always did. Route flights
// need the building whole as well.
function leaveStack() { if (stackOn && !stackApplying) exitStack(false); }

const _st_switchTo3D = switchTo3D;
switchTo3D = function () { leaveStack(); _st_switchTo3D(); };

const _st_switchToFloor = switchToFloor;
switchToFloor = function (level) { leaveStack(); _st_switchToFloor(level); };

const _st_closeBuilding = closeBuilding;
closeBuilding = function (opts) { leaveStack(); _st_closeBuilding(opts); };

const _st_flyRoute = flyRoute;
flyRoute = function () { leaveStack(); _st_flyRoute(); };

// openBuilding is deliberately not hooked: the stack *is* open (peelT = 1), so
// heat, highlights and routes can ask for the building to open without the
// view being taken away underneath them.

// ── the chip ─────────────────────────────────────────────────────────────
const STACK_ICON = '<svg viewBox="0 0 20 20" aria-hidden="true">'
  + '<rect x="2.4" y="12.6" width="12.2" height="3.6" rx="1"/>'
  + '<rect x="4.3" y="8" width="12.2" height="3.6" rx="1"/>'
  + '<rect x="6.2" y="3.4" width="12.2" height="3.6" rx="1"/></svg>';

let hudChipStack = null;

const _st_buildHud = buildHud;
buildHud = function () {
  _st_buildHud();
  if (hudChipStack) return;
  const chips = document.getElementById('hudFloors');
  if (!chips) return;
  const b = document.createElement('button');
  b.id = 'btnStack';
  b.className = 'hud-chip icon';
  b.innerHTML = STACK_ICON;
  b.title = 'Stack view: the flat floor plans, without the building';
  b.setAttribute('aria-label', 'Stack view');
  b.addEventListener('click', () => { setStack(); });
  // right after the 3D chip, where the poses of the building live
  if (hudChip3D && hudChip3D.nextSibling) chips.insertBefore(b, hudChip3D.nextSibling);
  else chips.appendChild(b);
  hudChipStack = b;
  syncHud();
};

const _st_syncHud = syncHud;
syncHud = function () {
  _st_syncHud();
  if (hudChipStack) hudChipStack.classList.toggle('on', stackOn);
  // In the stack the building has no pose, so 3D does not claim to be on.
  if (stackOn && hudChip3D) hudChip3D.classList.remove('on');
};

// ── the console handle ───────────────────────────────────────────────────
window.buildsim.stack = (b) => { setStack(b); return stackOn; };
if (window.buildsim.dev) {
  Object.defineProperty(window.buildsim.dev, 'stackOn', { get: () => stackOn });
}

</script>
