# Eclipse Mosquitto broker for the fire-safety system, with TLS (compose.tls.yaml).
# Every client logs in (one user per service, passwd) and may only publish
# and subscribe to its own topics (acl). The broker listens on the Docker
# network and on localhost only (see compose.override.yaml); anywhere else, use
# TLS: mosquitto-tls.conf (adds the 8883 listener), certificates from
# make-certs.sh, and compose.tls.yaml. Passwords: env.example -> .env ->
# make-passwd.sh.
# Plain listener: only reachable inside Docker (compose.tls.yaml publishes
# 8883 instead of 1883 on the host).
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# TLS listener; same users and ACL (per_listener_settings is false).
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Gateways publish hundreds of messages per tick.
max_queued_messages 100000
max_inflight_messages 1000
message_size_limit 1048576

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
